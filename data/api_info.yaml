baseInfo:
  api_name: 用户登录
  url: /arcana-auth/oauth/token
  method: post
  header: ${get_headers(json)}
#  cookies: ${get_extract_data(Cookie)}

testCases:
  - case_name: 用户正常登录校验
    data: {
      "username": "admin",
      "password": "25d55ad283aa400af464c76d713c07ad",
      "remember": "false",
      "tenantId": "000000",
      "grant_type": "password",
      "scope": "all",
      "verify": ""
    }
    validation:
      - contain: { 'msg': '登录成功' }
      - eq: { 'msg': '登录成功' }
    extract:
      #        token: '"msg_code":(\d*)'
      token: ${get_extract_data(token)}

    extract_list:
      goods_ids: $.goodIds

